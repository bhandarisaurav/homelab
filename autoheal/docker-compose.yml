services:
  autoheal:
    image: willfarrell/autoheal:latest
    container_name: autoheal
    restart: unless-stopped
    environment:
      - AUTOHEAL_CONTAINER_LABEL=all   # watches every container with a healthcheck
      - AUTOHEAL_INTERVAL=10           # check every 10s
      - AUTOHEAL_START_PERIOD=60       # grace period before first check (let slow containers boot)
      - AUTOHEAL_DEFAULT_STOP_TIMEOUT=10
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
