services:
  arcane:
    image: ghcr.io/getarcaneapp/manager:v3.1.1
    container_name: arcane
    restart: unless-stopped

    ports:
      - "3552:3552"

    volumes:
      # Arcane's own persistent state.
      # This directory should be gitignored.
      - ./data:/app/data

      # Docker API
      - /var/run/docker.sock:/var/run/docker.sock

      # Your Git checkout containing all Compose projects
      - /root/homelab:/app/data/projects:rw

    environment:
      ARCANE_APP_URL: "http://10.0.0.105:3552"
      ARCANE_ENCRYPTION_KEY: "${ARCANE_ENCRYPTION_KEY:?set in arcane/.env}"
      # Optional but useful
      TZ: "America/Toronto"
      PUID: "0"
      PGID: "0"

